<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAINIXSHOP</title>
    <!-- Подключаем Telegram Web App скрипт -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
        }
        h1 {
            color: #a855f7;
            text-align: center;
            letter-spacing: 2px;
        }
        .catalog {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .card {
            background-color: #1a1a1e;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        .price {
            color: #a855f7;
            font-weight: bold;
            margin-top: 8px;
        }
        .btn {
            background-color: #9333ea;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>RAINIXSHOP</h1>
    <p style="text-align: center; color: #888;"> streetwear & sneakers </p>

    <div class="catalog">
        <!-- Товар 1 -->
        <div class="card">
            <div style="height: 120px; background: #2b2b30; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666;">Фото</div>
            <div style="margin-top: 8px; font-size: 14px;">Кроссовки Нумерисы</div>
            <div class="price">4 000 сом</div>
            <button class="btn" onclick="addToCart('Кроссовки Нумерисы')">В корзину</button>
        </div>
        <!-- Товар 2 -->
        <div class="card">
            <div style="height: 120px; background: #2b2b30; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666;">Фото</div>
            <div style="margin-top: 8px; font-size: 14px;">Худи Oversize</div>
            <div class="price">3 500 сом</div>
            <button class="btn" onclick="addToCart('Худи Oversize')">В корзину</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function addToCart(item) {
            alert('Товар "' + item + '" добавлен в корзину!');
        }
    </script>
</body>
</html>
