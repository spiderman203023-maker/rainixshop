<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAINIXSHOP</title>
    <!-- Подключаем Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --accent-color: #9333ea;
            --accent-glow: rgba(147, 51, 234, 0.4);
            --text-main: #ffffff;
            --text-secondary: #888888;
            --border-color: #2b2b30;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            padding-bottom: 80px; /* Отступ под нижнее меню */
        }

        /* Шапка */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            color: #a855f7;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 15px var(--accent-glow);
            margin: 0;
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 4px;
        }

        /* Поиск */
        .search-box {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            margin-bottom: 16px;
            box-sizing: border-box;
            outline: none;
        }
        .search-box:focus {
            border-color: var(--accent-color);
        }

        /* Категории */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 16px;
            padding-bottom: 4px;
        }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }
        .cat-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* Каталог товаров */
        .catalog {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid var(--border-color);
        }
        .card-img {
            height: 130px;
            background: #2b2b30;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 8px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .card-price {
            color: #a855f7;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
        }
        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
        }

        /* Нижняя навигация */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #161619;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 4px;
        }
        .nav-item.active {
            color: #a855f7;
        }
        .nav-item span.icon {
            font-size: 18px;
        }

        /* Экраны (Вкладки) */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Стили для Корзины и Профиля */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .cart-empty {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Шапка общая -->
    <div class="header">
        <h1 class="logo">RAINIXSHOP</h1>
        <div class="subtitle">streetwear & sneakers</div>
    </div>

    <!-- ВСЕ ВКЛАДКИ -->

    <!-- 1. Магазин (Каталог) -->
    <div id="shop-screen" class="screen active">
        <input type="text" class="search-box" placeholder="Поиск по названию...">
        
        <div class="categories">
            <button class="cat-btn active">Все</button>
            <button class="cat-btn">Обувь</button>
            <button class="cat-btn">Верх</button>
            <button class="cat-btn">Низ</button>
            <button class="cat-btn">Аксессуары</button>
        </div>

        <div class="catalog" id="product-list">
            <!-- Товар 1 -->
            <div class="card">
                <div>
                    <div class="card-img">Фото</div>
                    <div class="card-title">Кроссовки Нумерисы</div>
                </div>
                <div>
                    <div class="card-price">4 000 сом</div>
                    <button class="btn" onclick="addToCart('Кроссовки Нумерисы', 4000)">В корзину</button>
                </div>
            </div>
            <!-- Товар 2 -->
            <div class="card">
                <div>
                    <div class="card-img">Фото</div>
                    <div class="card-title">Худи Oversize Black</div>
                </div>
                <div>
                    <div class="card-price">3 500 сом</div>
                    <button class="btn" onclick="addToCart('Худи Oversize Black', 3500)">В корзину</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. Покупки / Корзина -->
    <div id="cart-screen" class="screen">
        <div class="section-title">Корзина</div>
        <div id="cart-items">
            <div class="cart-empty">Ваша корзина пока пуста</div>
        </div>
        <div id="cart-total" style="margin-top: 20px; font-weight: bold; font-size: 16px;"></div>
    </div>

    <!-- 3. Профиль -->
    <div id="profile-screen" class="screen">
        <div class="section-title">Профиль</div>
        <div style="background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color);">
            <div id="user-name" style="font-weight: bold; font-size: 16px; margin-bottom: 4px;">Пользователь</div>
            <div id="user-username" style="color: var(--text-secondary); font-size: 13px;">@username</div>
            <div style="margin-top: 12px; color: #a855f7; font-size: 14px;">⭐ Бонусы: 0</div>
        </div>
    </div>

    <!-- Нижняя панель меню -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchScreen('shop', this)">
            <span class="icon">🏛️</span> Магазин
        </button>
        <button class="nav-item" onclick="switchScreen('cart', this)">
            <span class="icon">🛍️</span> Покупки
        </button>
        <button class="nav-item" onclick="switchScreen('profile', this)">
            <span class="icon">👤</span> Профиль
        </button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Заполняем данные профиля из Telegram, если они есть
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name || 'Пользователь';
            document.getElementById('user-username').innerText = user.username ? '@' + user.username : 'ID: ' + user.id;
        }

        // Корзина
        let cart = [];

        function addToCart(title, price) {
            cart.push({ title, price });
            alert(`Товар "${title}" добавлен в корзину!`);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                container.innerHTML = '<div class="cart-empty">Ваша корзина пока пуста</div>';
                totalContainer.innerHTML = '';
                return;
            }

            let html = '';
            let total = 0;
            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div style="background: var(--card-bg); padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-size: 14px; font-weight: 500;">${item.title}</div>
                            <div style="color: #a855f7; font-size: 13px; margin-top: 4px;">${item.price} сом</div>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;">Удалить</button>
                    </div>
                `;
            });
            container.innerHTML = html;
            totalContainer.innerHTML = `Итого: ${total} сом`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // Переключение экранов
        function switchScreen(screenName, element) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            if (screenName === 'shop') {
                document.getElementById('shop-screen').classList.add('active');
            } else if (screenName === 'cart') {
                document.getElementById('cart-screen').classList.add('active');
            } else if (screenName === 'profile') {
                document.getElementById('profile-screen').classList.add('active');
            }

            element.classList.add('active');
        }
    </script>
</body>
</html>
